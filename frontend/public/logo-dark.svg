  <g transform="translate(8, 8) scale(0.21875)">
    <path fill-rule="evenodd" d="
      M136 108 H292 C352 108 386 138 386 186 C386 218 364 240 332 250 C372 260 396 288 396 328 C396 378 354 408 288 408 H136 Z
      M202 158 L274 158 C304 158 324 174 326 200 L296 193 L278 218 L264 195 L232 218 L202 218 Z
      M202 266 L282 266 L330 288 L294 303 L332 321 L290 336 L320 354 L202 354 Z
    " fill="url(#betvaEmeraldDark)" />
  </g>

  <!-- White BETVA Wordmark -->
  <text x="142" y="82" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="60" font-weight="900" letter-spacing="4" fill="#FFFFFF">
    BETVA
  </text>

  <!-- Accent Bar -->
  <rect x="144" y="94" width="64" height="5" rx="2.5" fill="url(#betvaEmeraldDark)" />
</svg>
