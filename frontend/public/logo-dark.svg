<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 128" width="460" height="128" role="img" aria-labelledby="betvaLogoDarkTitle">
  <title id="betvaLogoDarkTitle">BETVA Logo</title>
  <defs>
    <linearGradient id="betvaEmeraldDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Rounded Square Emblem Badge -->
  <rect x="8" y="8" width="112" height="112" rx="26" fill="#1E293B" stroke="#334155" stroke-width="2" />

